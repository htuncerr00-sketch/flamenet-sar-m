# FluidNC machine_config.yaml
# Filament Winding Machine — Faz 15
# Generated by machine_config.py

name: FilamentWinderFAZ15
board: generic_esp32

axes:
  shared_stepper_disable_pin: NO_PIN

  x:
    steps_per_mm: 400.0
    max_rate_mm_per_min: 4800
    acceleration: 500
    max_travel_mm: 400
    soft_limits: true
    homing:
      cycle: 1
      positive_direction: false
      mpos: 0
      feed_mm_per_min: 200
      seek_mm_per_min: 1000
      settle_ms: 250
      seek_scaler: 1.1
      feed_scaler: 1.1
    motor0:
      limit_neg_pin: gpio.15:low
      limit_pos_pin: gpio.2:low
      stepstick:
        step_pin:    gpio.12
        direction_pin: gpio.14
        disable_pin: gpio.27:low
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN

  a:
    steps_per_mm: 44.4444  # degrees
    max_rate_mm_per_min: 80000
    acceleration: 5000
    max_travel_mm: 999999  # unlimited rotation
    soft_limits: false
    homing:
      cycle: 0
    motor0:
      stepstick:
        step_pin:    gpio.26
        direction_pin: gpio.25
        disable_pin: gpio.33:low

control:
  safety_door_pin:  gpio.13:low:pu  # E-stop (active-low, pull-up)
  feed_hold_pin:    NO_PIN
  cycle_start_pin:  NO_PIN
  reset_pin:        NO_PIN

probe:
  pin: gpio.22:low:pu

uart1:
  txd_pin: gpio.1
  rxd_pin: gpio.0
  baud:    921600
  mode:    8N1

spi:
  miso_pin: gpio.19  # Not used for TMC UART
  mosi_pin: gpio.23
  sck_pin:  gpio.18

coolant:
  mist_pin:  NO_PIN
  flood_pin: NO_PIN

user_outputs:
  analog0_pin: gpio.4  # STO relay output

# Spindle (used for tension reference output via DAC)
spindle:
  type: none

# Timing
stepping:
  engine:     RMT    # ESP32 RMT peripheral — jitter <1µs
  idle_ms:    255
  dir_delay_us:  10
  pulse_us:      5
  disable_delay_us: 0